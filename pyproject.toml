[       project]
name = "taxi-data-etl"
version = "0.1.0"
description = "Modular ELT pipeline for NYC Taxi data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.13.0",
    "hypothesis>=6.100.0",
    "vcrpy>=6.2.0",
    "testcontainers[minio]>=1.19.0",
    "pytest-asyncio>=0.23.0",
    "mutmut>=1.5.0",
    "atheris>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["extract"]

[tool.mutmut]
paths_to_mutate = ["extract"]
pytest_add_cli_args_test_selection = ["tests/unit"]
