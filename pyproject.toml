[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-clickhouse-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
include = ["extract*", "upload*"]
exclude = ["mutants*", "tests*", ".venv*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
norecursedirs = ["mutants", "tests/fuzz", "tests/e2e", ".venv", "__pycache__"]

[tool.mutmut]
paths_to_mutate = ["extract"]
do_not_mutate = ["tests/*", "conftest.py", "test_*.py", "*/__init__.py"]
runner = "python -m pytest /home/nobu/projects/taxi-data-etl/tests/unit/test_downloader.py /home/nobu/projects/taxi-data-etl/tests/unit/test_parser_property.py /home/nobu/projects/taxi-data-etl/tests/unit/test_parser_unit.py --norecursedirs=mutants --norecursedirs=tests/fuzz --norecursedirs=tests/e2e -q"
exclude_dirs = ["__pycache__", ".venv", "mutants"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mutmut>=3.0",
  "hypothesis>=6.0",
  "respx>=0.23.0",
  "vcrpy>=6.2.0",
  "radon>=6.0",
  "xenon>=0.9",
  "cohesion>=1.2",
  "testcontainers[minio]>=4.6",
  "atheris>=3.0.0",
]
