name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Get changed source files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Push to main — running full test suite"
            echo "files=FULL" >> $GITHUB_OUTPUT
          else
            git fetch origin main
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="origin/${{ github.base_ref }}"
            else
              BASE="origin/main"
            fi
            FILES=$(git diff --name-only "$BASE"..HEAD \
              | grep -E '^extract/.*\.py$' \
              | grep -v '^tests/' \
              | tr '\n' ' ')
            if [ -z "$FILES" ]; then
              echo "No Python source files changed — skipping"
            else
              echo "Changed: $FILES"
            fi
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        if: steps.changed.outputs.files != '' && steps.changed.outputs.files != 'FULL'
        run: |
          echo "Running unit tests for affected modules..."
          uv run pytest -v tests/unit/

      - name: Run full unit tests (main push)
        if: steps.changed.outputs.files == 'FULL'
        run: uv run pytest -v tests/unit/

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Get changed source files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "files=FULL" >> $GITHUB_OUTPUT
          else
            git fetch origin main
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="origin/${{ github.base_ref }}"
            else
              BASE="origin/main"
            fi
            FILES=$(git diff --name-only "$BASE"..HEAD \
              | grep -E '^extract/.*\.py$' \
              | grep -v '^tests/' \
              | tr '\n' ' ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run fuzz tests (incremental)
        if: steps.changed.outputs.files != '' && steps.changed.outputs.files != 'FULL'
        run: |
          FOUND=$(find tests/fuzz -name "test_fuzz*.py" -type f)
          for f in $FOUND; do
            echo "Running fuzz tests: ${f}..."
            uv run python "$f" -runs=100000
          done

      - name: Run full fuzz tests (main push)
        if: steps.changed.outputs.files == 'FULL'
        run: |
          FOUND=$(find tests/fuzz -name "test_fuzz*.py" -type f)
          for f in $FOUND; do
            echo "Running fuzz tests: ${f}..."
            uv run python "$f" -runs=1000000
          done

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Get changed source files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Push to main — running full mutation suite"
            echo "files=FULL" >> $GITHUB_OUTPUT
          else
            git fetch origin main
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="origin/${{ github.base_ref }}"
            else
              BASE="origin/main"
            fi
            FILES=$(git diff --name-only "$BASE"..HEAD \
              | grep -E '^extract/.*\.py$' \
              | grep -v '^tests/' \
              | tr '\n' ' ')
            if [ -z "$FILES" ]; then
              echo "No Python source files changed — skipping mutation"
            else
              echo "Mutating: $FILES"
            fi
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run mutation CI (incremental)
        if: steps.changed.outputs.files != '' && steps.changed.outputs.files != 'FULL'
        run: uv run bash scripts/run_mutation_ci.sh 85 ${{ steps.changed.outputs.files }}

      - name: Run mutation CI (full)
        if: steps.changed.outputs.files == 'FULL'
        run: uv run bash scripts/run_mutation_ci.sh 85

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Get changed source files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "files=FULL" >> $GITHUB_OUTPUT
          else
            git fetch origin main
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="origin/${{ github.base_ref }}"
            else
              BASE="origin/main"
            fi
            FILES=$(git diff --name-only "$BASE"..HEAD \
              | grep -E '^extract/.*\.py$' \
              | grep -v '^tests/' \
              | tr '\n' ' ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run quality checks (incremental)
        if: steps.changed.outputs.files != '' && steps.changed.outputs.files != 'FULL'
        run: uv run bash scripts/run_quality_ci.sh ${{ steps.changed.outputs.files }}

      - name: Run full quality checks (main push)
        if: steps.changed.outputs.files == 'FULL'
        run: uv run bash scripts/run_quality_ci.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync

      - name: Get changed source files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "files=FULL" >> $GITHUB_OUTPUT
          else
            git fetch origin main
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE="origin/${{ github.base_ref }}"
            else
              BASE="origin/main"
            fi
            FILES=$(git diff --name-only "$BASE"..HEAD \
              | grep -E '^extract/.*\.py$' \
              | grep -v '^tests/' \
              | tr '\n' ' ')
            echo "files=$FILES" >> $GITHUB_OUTPUT
          fi

      - name: Run e2e tests (incremental)
        if: steps.changed.outputs.files != '' && steps.changed.outputs.files != 'FULL'
        run: uv run pytest -v tests/e2e/

      - name: Run full e2e tests (main push)
        if: steps.changed.outputs.files == 'FULL'
        run: uv run pytest -v tests/e2e/
